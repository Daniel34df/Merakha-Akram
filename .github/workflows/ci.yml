name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20.12 est la version minimale annoncée dans package.json ; 22 est la
        # version courante en service. Les deux doivent passer.
        node: ['20.12', '22']
    name: Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # Aucune dépendance obligatoire : les tests s'exécutent sur Node seul,
      # sans npm install. C'est aussi ce qui est vérifié ici.
      - run: npm test
